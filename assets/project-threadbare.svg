<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 190" width="100%" role="img" aria-label="Threadbare">
  <defs>
    <linearGradient id="ptTitleGrad" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="500" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ptPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1120"/>
      <stop offset="100%" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="ptBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="ptClip">
      <rect x="4" y="4" width="1152" height="182" rx="16"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="1152" height="182" rx="16" fill="url(#ptPanelGrad)" stroke="url(#ptBorderGrad)" stroke-width="1.5"/>

  <g clip-path="url(#ptClip)" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <image href="https://api.iconify.design/lucide/gamepad-2.svg?color=%23a78bfa" x="36" y="26" width="22" height="22"/>
    <text x="70" y="43" font-size="20" font-weight="800" fill="url(#ptTitleGrad)">Threadbare</text>

    <text x="36" y="93" font-size="15" fill="#c9d1d9">Contribución al desarrollo del juego narrativo Threadbare durante el GamLab 5.0 UTP.</text>

    <g font-size="12.5" font-weight="600" fill="#e6e9f2">
      <rect x="36" y="126" width="74" height="28" rx="14" fill="#101a2e" stroke="url(#ptBorderGrad)" stroke-width="1"/>
      <text x="73" y="144" text-anchor="middle">Godot</text>

      <rect x="122" y="126" width="102" height="28" rx="14" fill="#101a2e" stroke="url(#ptBorderGrad)" stroke-width="1"/>
      <text x="173" y="144" text-anchor="middle">GDScript</text>
    </g>
  </g>
</svg>
