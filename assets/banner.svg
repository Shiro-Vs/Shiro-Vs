      <rect x="24" y="344" width="150" height="34" rx="17" fill="#a78bfa"/>
      <text x="99" y="366" text-anchor="middle" fill="#1b1030" font-weight="bold">ShiroVS</text>

      <path d="M174 344 l17 17 l-17 17 z" fill="#f472b6"/>
      <rect x="191" y="344" width="110" height="34" rx="17" fill="#f472b6"/>
