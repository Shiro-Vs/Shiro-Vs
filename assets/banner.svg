    <text x="80" y="290" font-family="'Courier New', monospace" font-size="28" fill="#7ee787" opacity="0">
      <tspan>&gt; Full-Stack Developer</tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.018;0.232;0.25;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="290" font-family="'Courier New', monospace" font-size="28" fill="#7ee787" opacity="0">
      <tspan>&gt; Cofundador @ Vexa</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.268;0.482;0.5;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="290" font-family="'Courier New', monospace" font-size="28" fill="#7ee787" opacity="0">
      <tspan>&gt; Building EVA &amp; Fivuza</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.518;0.732;0.75;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="290" font-family="'Courier New', monospace" font-size="28" fill="#7ee787" opacity="0">
      <tspan>&gt; Lima, Peru</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.768;0.982;1.0" dur="10.0s" repeatCount="indefinite"/>
