<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="100%" role="img" aria-label="ShiroVS terminal banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#131a2c"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241a3a"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="0" y="0" width="1600" height="560" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#windowClip)">
    <rect width="1600" height="560" fill="url(#bg)"/>

    <!-- skyline silhouette -->
    <g fill="url(#skyline)" opacity="0.6">
      <rect x="1120" y="370" width="40" height="190"/>
      <rect x="1170" y="320" width="30" height="240"/>
      <rect x="1210" y="390" width="55" height="170"/>
      <rect x="1275" y="290" width="25" height="270"/>
      <rect x="1310" y="350" width="45" height="210"/>
      <rect x="1365" y="400" width="35" height="160"/>
      <rect x="1410" y="330" width="28" height="230"/>
      <rect x="1450" y="380" width="60" height="180"/>
      <rect x="1520" y="340" width="30" height="220"/>
      <rect x="1560" y="395" width="40" height="165"/>
    </g>

    <!-- title bar -->
    <rect x="0" y="0" width="1600" height="56" fill="#0d1117"/>
    <circle cx="30" cy="28" r="9" fill="#ff5f56"/>
    <circle cx="58" cy="28" r="9" fill="#ffbd2e"/>
    <circle cx="86" cy="28" r="9" fill="#27c93f"/>
    <text x="800" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#8b93a7">cmd — ShiroVS</text>

    <!-- ascii-art title -->
    <g font-family="'Cascadia Code', 'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="bold" xml:space="preserve">
      <text x="82" y="122" font-size="34" fill="#000000" opacity="0.35">
        <tspan x="82" dy="0">  ▄▄▄▄▄                      ▄▄▄         ▄▄▄▄▄   </tspan>
        <tspan x="82" dy="38"> ██▀▀▀▀█▄ █▄                █▀██  ██▀▀  ██▀▀▀▀█▄ </tspan>
        <tspan x="82" dy="38"> ▀██▄  ▄▀ ██    ▀▀ ▄          ██  ██    ▀██▄  ▄▀ </tspan>
        <tspan x="82" dy="38">   ▀██▄▄  ████▄ ██ ████▄▄███▄ ██  ██      ▀██▄▄  </tspan>
        <tspan x="82" dy="38"> ▄   ▀██▄ ██ ██ ██ ██   ██ ██ ██▄ ██    ▄   ▀██▄ </tspan>
        <tspan x="82" dy="38"> ▀██████▀▄██ ██▄██▄█▀  ▄▀███▀  ▀███▀    ▀██████▀ </tspan>
      </text>
      <text x="80" y="118" font-size="34" fill="url(#titleGrad)">
        <tspan x="80" dy="0">  ▄▄▄▄▄                      ▄▄▄         ▄▄▄▄▄   </tspan>
        <tspan x="80" dy="38"> ██▀▀▀▀█▄ █▄                █▀██  ██▀▀  ██▀▀▀▀█▄ </tspan>
        <tspan x="80" dy="38"> ▀██▄  ▄▀ ██    ▀▀ ▄          ██  ██    ▀██▄  ▄▀ </tspan>
        <tspan x="80" dy="38">   ▀██▄▄  ████▄ ██ ████▄▄███▄ ██  ██      ▀██▄▄  </tspan>
        <tspan x="80" dy="38"> ▄   ▀██▄ ██ ██ ██ ██   ██ ██ ██▄ ██    ▄   ▀██▄ </tspan>
        <tspan x="80" dy="38"> ▀██████▀▄██ ██▄██▄█▀  ▄▀███▀  ▀███▀    ▀██████▀ </tspan>
      </text>
    </g>

    <text x="80" y="410" font-family="'Courier New', monospace" font-size="32" fill="#7ee787" opacity="0">
      <tspan>&gt; Full-Stack Developer</tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.018;0.232;0.25;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="410" font-family="'Courier New', monospace" font-size="32" fill="#7ee787" opacity="0">
      <tspan>&gt; Cofundador @ Vexa</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.268;0.482;0.5;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="410" font-family="'Courier New', monospace" font-size="32" fill="#7ee787" opacity="0">
      <tspan>&gt; Building EVA &amp; Fivuza</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.518;0.732;0.75;1" dur="10.0s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="410" font-family="'Courier New', monospace" font-size="32" fill="#7ee787" opacity="0">
      <tspan>&gt; Lima, Peru</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.768;0.982;1.0" dur="10.0s" repeatCount="indefinite"/>
    </text>

    <rect x="720" y="384" width="16" height="34" fill="#7ee787">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- status bar -->
    <g font-family="'Courier New', monospace" font-size="18">
      <rect x="24" y="508" width="150" height="34" rx="17" fill="#a78bfa"/>
      <text x="99" y="530" text-anchor="middle" fill="#1b1030" font-weight="bold">ShiroVS</text>

      <path d="M174 508 l17 17 l-17 17 z" fill="#f472b6"/>
      <rect x="191" y="508" width="110" height="34" rx="17" fill="#f472b6"/>
      <text x="246" y="530" text-anchor="middle" fill="#1b1030" font-weight="bold">~/vexa</text>

      <path d="M301 508 l17 17 l-17 17 z" fill="#38bdf8"/>
      <rect x="318" y="508" width="130" height="34" rx="17" fill="#38bdf8"/>
      <text x="383" y="530" text-anchor="middle" fill="#0b0f1a" font-weight="bold">build ok</text>

      <rect x="1330" y="508" width="90" height="34" rx="17" fill="#27c93f"/>
      <text x="1375" y="530" text-anchor="middle" fill="#0b0f1a" font-weight="bold">online</text>

      <rect x="1428" y="508" width="148" height="34" rx="17" fill="#0d1117" stroke="#2a3350"/>
      <text x="1502" y="530" text-anchor="middle" fill="#8b93a7">GMT-5 · Lima</text>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="558" rx="14" fill="none" stroke="#2a3350" stroke-width="2"/>
</svg>
